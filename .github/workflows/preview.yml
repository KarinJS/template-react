name: Preview

# 预览版发布：PR 发 alpha、main 发 beta、其他分支发 dev，产物托管在 pkg.pr.new。
# 正式版（release-please → npm）由 release.yml 负责，两者互不干扰。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/docs/**'
      - 'skills/**'
      - '*.md'
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'packages/docs/**'
      - 'skills/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v7
        with:
          # 预览版本号需要读取提交记录，拉全量历史
          fetch-depth: 0

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 🔨 构建 core
        run: pnpm --filter @karinjs/template-react run build

      - name: 🏷️ 生成预览版本号（alpha/beta/dev + 时间戳 + 短 sha）
        id: version-gen
        working-directory: packages/core
        run: |
          set -e
          PKG_VERSION=$(node -p "require('./package.json').version")
          BASE_CLEAN=$(echo "$PKG_VERSION" | sed 's/-.*$//')
          MAJOR=$(echo "$BASE_CLEAN" | cut -d. -f1)
          MINOR=$(echo "$BASE_CLEAN" | cut -d. -f2)
          PATCH=$(echo "$BASE_CLEAN" | cut -d. -f3)

          # 依据本次推送/PR 的提交前缀决定 bump 级别（与 release-please 同规则）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          COMMITS=$(git log --no-merges --pretty=format:'%s%n%b%n---' "$COMMIT_RANGE")

          BUMP="patch"
          if echo "$COMMITS" | grep -Eqi 'BREAKING CHANGE|^[[:space:]]*[a-z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eqi '^[[:space:]]*feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BASE_NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            NEW_VERSION="${BASE_NEXT}-alpha.${{ github.event.number }}.${TIMESTAMP}.${COMMIT_SHORT}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            NEW_VERSION="${BASE_NEXT}-beta.${TIMESTAMP}.${COMMIT_SHORT}"
          else
            NEW_VERSION="${BASE_NEXT}-dev.${TIMESTAMP}.${COMMIT_SHORT}"
          fi

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 预览版本：$NEW_VERSION"

      - name: 🚀 发布预览包到 pkg.pr.new
        id: publish
        working-directory: packages/core
        run: |
          pnpm exec pkg-pr-new publish --packageManager=pnpm

      - name: 📊 生成摘要（含安装命令）
        env:
          PACKAGE_URLS: ${{ steps.publish.outputs.urls }}
        run: |
          PKG='@karinjs/template-react'
          VERSION='${{ steps.version-gen.outputs.version }}'
          test -n "$PACKAGE_URLS"
          {
            echo '## 📦 预览版发布成功'
            echo ''
            echo "- **包名：** \`${PKG}\`"
            echo "- **版本：** \`${VERSION}\`"
            echo "- **pkg.pr.new 标识：** \`${{ steps.publish.outputs.sha }}\`"
            echo ''
            echo '### 安装命令'
            echo '```bash'
            echo "pnpm add ${PACKAGE_URLS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
