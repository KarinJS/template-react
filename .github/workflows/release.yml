name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 解析 conventional commits，自动维护 release PR（版本号 + CHANGELOG）；
  # 合并 release PR 后创建 GitHub release 并触发发布。
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  verify-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @karinjs/template-react run build
      # 仅在发布前处理：带入根目录 LICENSE（npm 会自动打进产物）；剥离 devDependencies
      # 注意必须在 lint/test/build 之后执行，前面的步骤依赖 devDependencies 字段
      - run: cp LICENSE packages/core/LICENSE
      - run: pnpm pkg delete devDependencies
        working-directory: packages/core
      - run: pnpm --filter @karinjs/template-react publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
