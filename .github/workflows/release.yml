name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 解析 conventional commits，自动维护 release PR（版本号 + CHANGELOG）；
  # 合并 release PR 后创建 GitHub release 并触发发布。
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  verify-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm --filter @karinjs/template-react run build
      - run: cp LICENSE packages/core/LICENSE

      # 版本号由 release-please 的 release-as 手动指定，dist-tag 跟随版本号里的
      # 预发布标识自动推导（0.0.1-beta.1 → beta，正式版 → latest），避免 beta 打上 latest。
      - name: 从版本号推导 npm dist-tag
        id: dist-tag
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag=$(node -p "('$version'.split('-')[1] || 'latest').split('.')[0]")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version, tag=$tag"

      - run: pnpm --filter @karinjs/template-react publish --access public --no-git-checks --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
